name: Publish Babzi UI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Promote new UI
        run: cp web/babzi-ui.html web/index.html
      - name: Commit promoted UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Promote Babzi research workspace UI"
          git push
