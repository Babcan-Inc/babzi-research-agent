name: Phase 2.1 Python runtime test

on:
  push:
    paths:
      - 'agent/**'
      - '.github/workflows/phase21.yml'
  workflow_dispatch:

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r agent/requirements.txt

      - name: Run cryptographic self-test
        run: python agent/phase21_selftest.py
