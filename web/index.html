<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Babzi Research Agent — Operator Console</title><style>:root{color-scheme:dark}body{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;max-width:760px;margin:auto;padding:24px;line-height:1.5;background:#111;color:#f5f5f5}.card{border:1px solid #333;border-radius:16px;padding:18px;margin:16px 0;background:#181818}h1{margin-bottom:4px}p{color:#bbb}label{display:block;margin:12px 0 6px;font-weight:600}input,textarea,button{width:100%;box-sizing:border-box;border-radius:10px;border:1px solid #444;padding:12px;background:#0f0f0f;color:#fff;font:inherit}button{cursor:pointer;margin-top:12px}button:disabled{opacity:.5}.did{word-break:break-all;font-family:ui-monospace,monospace;font-size:13px}.status{padding:10px;border-radius:10px;background:#222;margin-top:12px}.ok{border:1px solid #3a7}.err{border:1px solid #a44}.small{font-size:13px;color:#999}</style></head><body><h1>Babzi Research Agent</h1><p>Human-supervised operator console. Identity material stays local to this browser session.</p><div class="card"><h2>1. Identity</h2><label>Encrypted identity.pem</label><input id="key" type="file" accept=".pem,application/x-pem-file"><label>Passphrase</label><input id="pass" type="password" minlength="12"><label>Agent DID</label><input id="didInput" value="did:key:z6MknNFFDhTxVphuobaMZoQUmCYLMGjo4LiyZo1A5EpsxKrH"><button id="verify">Verify identity locally</button><div id="status" class="status">No identity loaded.</div><div id="did" class="did"></div><p class="small">The PEM and passphrase are not uploaded by this page.</p></div><div class="card"><h2>2. Technocore</h2><p>Publishing remains disabled until identity verification succeeds.</p><button id="sign" disabled>Sign &amp; publish</button></div><script>
const $=x=>document.getElementById(x);const te=new TextEncoder();
function b64(s){const x=s.replace(/\s/g,'');return Uint8Array.from(atob(x+'='.repeat((4-x.length%4)%4)),c=>c.charCodeAt(0))}
function pem(s){const m=s.match(/-----BEGIN ENCRYPTED PRIVATE KEY-----([\s\S]*?)-----END ENCRYPTED PRIVATE KEY-----/);if(!m)throw Error('Expected encrypted PKCS#8 PEM');return b64(m[1])}
function tlv(b,o=0){const tag=b[o++];let n=b[o++];if(n&128){const k=n&127;n=0;for(let i=0;i<k;i++)n=n*256+b[o++]}const start=o,end=o+n;if(end>b.length)throw Error('Invalid ASN.1 bounds');return{tag,start,end,next:end}}
function kids(b,t){if(t.tag!==48)throw Error('Invalid ASN.1 sequence');const a=[];for(let p=t.start;p<t.end;){const x=tlv(b,p);a.push(x);p=x.next}return a}
function val(b,t){return b.slice(t.start,t.end)}
function oid(b,t){const v=val(b,t);if(!v.length)throw Error('Invalid OID');const out=[Math.min(2,Math.floor(v[0]/40)),v[0]<80?v[0]%40:v[0]-80];let n=0;for(let i=1;i<v.length;i++){n=n*128+(v[i]&127);if(!(v[i]&128)){out.push(n);n=0}}return out.join('.')}
async function decrypt(text,pwd){const d=pem(text),r=tlv(d),c=kids(d,r);if(c.length!==2)throw Error('Invalid encrypted PKCS#8 container');const a=kids(d,c[0]);if(oid(d,a[0])!=='1.2.840.113549.1.5.13')throw Error('Unsupported encryption: PBES2 required');const pp=kids(d,a[1]);const k=kids(d,pp[0]),e=kids(d,pp[1]);if(oid(d,k[0])!=='1.2.840.113549.1.5.12')throw Error('Unsupported KDF: PBKDF2 required');const kp=kids(d,k[1]);const salt=val(d,kp[0]);let it=0;for(const x of val(d,kp[1]))it=it*256+x;let hash='SHA-256';if(kp[3]){const pr=kids(d,kp[3]);hash=oid(d,pr[0])==='1.2.840.113549.2.7'?'SHA-1':'SHA-256'}if(oid(d,e[0])!=='2.16.840.1.101.3.4.1.42')throw Error('Unsupported cipher: AES-256-CBC required');const ep=kids(d,e[1]);const iv=val(d,ep[0]),ct=val(d,c[1]);const base=await crypto.subtle.importKey('raw',te.encode(pwd),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:it,hash},{...{name:'AES-CBC',length:256},name:'AES-CBC',length:256},false,['decrypt']);return new Uint8Array(await crypto.subtle.decrypt({name:'AES-CBC',iv},key,ct))}
async function load(){const f=$('key').files[0],p=$('pass').value,s=$('status');try{if(!f)throw Error('Choose identity.pem first');if(p.length<12)throw Error('Passphrase must contain at least 12 characters');const plain=await decrypt(await f.text(),p);const key=await crypto.subtle.importKey('pkcs8',plain,{name:'Ed25519'},false,['sign']);s.className='status ok';s.textContent='Encrypted PEM decrypted successfully and the browser loaded an Ed25519 private key. We can now add DID verification as the next test.';window.babziKey=key;$('did').textContent=$('didInput').value;$('sign').disabled=false}catch(e){s.className='status err';s.textContent=e.message}}
$('verify').onclick=load;
</script></body></html>
