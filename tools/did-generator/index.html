<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Babzi Research Agent — DID Generator</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:720px;margin:40px auto;padding:0 20px;line-height:1.5}button{font-size:17px;padding:12px 16px;border-radius:10px;border:1px solid #888;background:#fff}input{font-size:17px;padding:12px;width:100%;box-sizing:border-box;margin:6px 0 14px}.warning{padding:12px;border:1px solid #cc9;border-radius:10px;background:#fffbe6}#result{word-break:break-all}</style></head>
<body><h1>Babzi Research Agent</h1><p>Local browser tool for creating an encrypted Ed25519 <code>did:key</code> identity.</p><div class="warning"><strong>Security:</strong> the private key is generated and encrypted in this browser. Never upload the resulting file or passphrase to GitHub, ChatGPT, or anyone else.</div><label for="pass">Passphrase (12+ characters)</label><input id="pass" type="password" autocomplete="new-password"><button id="generate">Generate identity</button><div id="result"></div>
<script>
const alphabet='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';
const te=new TextEncoder();
function b58(bytes){let z=0;for(const b of bytes){if(b)break;z++}let n=0n;for(const b of bytes)n=(n<<8n)+BigInt(b);let s='';while(n){const r=Number(n%58n);s=alphabet[r]+s;n/=58n}return '1'.repeat(z)+(s||'');}
function concat(...xs){const out=new Uint8Array(xs.reduce((n,x)=>n+x.length,0));let p=0;for(const x of xs){out.set(x,p);p+=x.length}return out}
function b64(bytes){let s='';for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(s)}
function pem(bytes){const s=b64(bytes),lines=[];for(let i=0;i<s.length;i+=64)lines.push(s.slice(i,i+64));return '-----BEGIN BABZI ENCRYPTED IDENTITY-----\n'+lines.join('\n')+'\n-----END BABZI ENCRYPTED IDENTITY-----\n'}
async function encrypt(pkcs8,password){
 const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
 const material=await crypto.subtle.importKey('raw',te.encode(password),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt']);
 const ciphertext=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,pkcs8));
 const payload={v:1,kdf:'PBKDF2-SHA256',iterations:600000,cipher:'AES-256-GCM',salt:b64(salt),iv:b64(iv),ciphertext:b64(ciphertext)};
 return new TextEncoder().encode(JSON.stringify(payload));
}
function download(name,bytes){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([bytes],{type:'application/octet-stream'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function generate(){const pass=document.querySelector('#pass').value,result=document.querySelector('#result');if(pass.length<12){result.textContent='Use a passphrase of at least 12 characters.';return}if(!crypto.subtle){result.textContent='Web Crypto is unavailable in this browser.';return}try{const key=await crypto.subtle.generateKey({name:'Ed25519'},true,['sign','verify']);const rawPub=new Uint8Array(await crypto.subtle.exportKey('raw',key.publicKey));const pkcs8=new Uint8Array(await crypto.subtle.exportKey('pkcs8',key.privateKey));const did='did:key:z'+b58(concat(new Uint8Array([0xed,0x01]),rawPub));const encrypted=await encrypt(pkcs8,pass);download('identity.babzi',encrypted);result.innerHTML='<h2>Identity created</h2><p><strong>DID:</strong> '+did+'</p><p><strong>Downloaded:</strong> <code>identity.babzi</code></p><p>This is an encrypted, browser-native identity container. It is intentionally not pretending to be a PEM file.</p>';document.querySelector('#pass').value='';}catch(e){result.textContent='Could not create identity: '+e.message}}
document.querySelector('#generate').addEventListener('click',generate);
</script></body></html>
